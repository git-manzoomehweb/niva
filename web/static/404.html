<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../assets/css/output.css">
</head>

<body>
<main>
    <input class="inp" type="text" placeholder="search user">
    <ul class="users">

    </ul>
</main>


<script src="../assets/js/niva-core.js"></script>
<script>
    const users = [
        {name: 'milad', age: 28},
        {name: 'alireza', age: 29},
        {name: 'farhad', age: 30},
        {name: 'mohammad', age: 20},
    ];
    const ulUsers = document.querySelector('.users');
    const inpUser = document.querySelector('.inp');


    function displayShow(usersToDisplay) {
        usersToDisplay.forEach(item => {
            ulUsers.innerHTML += `
                <li class="flex items-center gap-2">
                  <span>${item.name}</span>
                  ----
                  <span>${item.age}</span>
                </li>
            `
        })
    }

    displayShow(users)

    inpUser.addEventListener('input', function () {
        const searchTerm = inpUser.value
        let usersToDisplay;
        if (searchTerm.trim() === "") {
            usersToDisplay = users;
        } else {
            usersToDisplay = users.filter(item=>{
                item.name.toLowerCase().includes(searchTerm.toLowerCase())
            })
        }
        displayShow(usersToDisplay);
    })
</script>
</body>

</html>
